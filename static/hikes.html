<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hikes — Flightlog</title>
  <link rel="stylesheet" href="/static/shared.css">
</head>
<body>
  <div id="appNav"></div>

  <main class="container">
    <div class="card">
      <div class="page-head">
        <h1 data-i18n="hikes.title">Hikes</h1>
      </div>

      <div id="alert" class="alert alert-error"></div>
      <div id="resultCount" class="muted"></div>

      <div class="table-scroll">
        <table id="hikesTable">
          <thead>
            <tr>
              <th data-i18n="hikes.col.date">Date</th>
              <th data-i18n="hikes.col.route">Route</th>
              <th data-i18n="hikes.col.ascent">Ascent</th>
              <th data-i18n="hikes.col.descent">Descent</th>
              <th data-i18n="hikes.col.distance">Distance</th>
              <th data-i18n="hikes.col.duration">Duration</th>
              <th data-i18n="hikes.col.flight">Became a flight</th>
            </tr>
          </thead>
          <tbody id="hikesBody"></tbody>
        </table>
      </div>

      <div id="emptyState" class="empty-state" hidden>
        <p data-i18n="hikes.empty">No hikes recorded.</p>
      </div>
    </div>
  </main>

  <script type="module" src="/static/hikes.js"></script>
</body>
</html>
