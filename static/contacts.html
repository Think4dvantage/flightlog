<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacts — Flightlog</title>
  <link rel="stylesheet" href="/static/shared.css">
</head>
<body>
  <div id="appNav"></div>

  <main class="container">
    <div class="card">
      <div class="page-head">
        <h1 data-i18n="contacts.title">Contacts</h1>
        <button type="button" id="addContactBtn" data-i18n="contacts.add">Add contact</button>
      </div>

      <div id="alert" class="alert alert-error"></div>
      <div id="resultCount" class="muted"></div>

      <div class="table-scroll">
        <table id="contactsTable">
          <thead>
            <tr>
              <th data-i18n="contacts.col.name">Name</th>
              <th data-i18n="contacts.col.flight_count">Flights together</th>
              <th data-i18n="contacts.col.actions">Actions</th>
            </tr>
          </thead>
          <tbody id="contactsBody"></tbody>
        </table>
      </div>

      <div id="emptyState" class="empty-state" hidden>
        <p data-i18n="contacts.empty">No contacts yet.</p>
      </div>
    </div>
  </main>

  <div id="drawerOverlay" class="drawer-overlay" hidden></div>
  <aside id="contactDrawer" class="drawer" hidden aria-hidden="true">
    <div class="drawer-head">
      <h2 id="drawerTitle" data-i18n="contacts.drawer.add_title">Add contact</h2>
      <button type="button" id="drawerClose" class="btn-ghost" aria-label="Close">×</button>
    </div>

    <div id="drawerAlert" class="alert alert-error"></div>

    <form id="contactForm" novalidate>
      <input type="hidden" id="c_id">

      <div class="field">
        <label for="c_name" data-i18n="contacts.drawer.name">Name</label>
        <input type="text" id="c_name" required maxlength="80">
        <p class="field-error" data-field="display_name"></p>
      </div>

      <div class="drawer-actions">
        <button type="submit" id="drawerSave" data-i18n="contacts.drawer.save">Save</button>
        <button type="button" id="drawerDelete" class="btn-ghost" data-i18n="contacts.drawer.delete" hidden>Delete</button>
      </div>

      <div id="deleteConfirm" class="delete-confirm" hidden>
        <p data-i18n="contacts.delete_confirm.prompt">Delete this contact? Any flights tagged with them keep their other tags, but lose this one. This cannot be undone.</p>
        <button type="button" id="deleteConfirmYes" class="btn-danger" data-i18n="contacts.delete_confirm.yes">Delete</button>
        <button type="button" id="deleteConfirmNo" class="btn-ghost" data-i18n="contacts.delete_confirm.no">Cancel</button>
      </div>
    </form>
  </aside>

  <script type="module" src="/static/contacts.js"></script>
</body>
</html>
