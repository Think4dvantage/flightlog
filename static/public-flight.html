<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared flight — Flightlog</title>
  <link rel="stylesheet" href="/static/shared.css">
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
</head>
<body>
  <div id="appNav"></div>

  <main class="container">
    <div class="card">
      <div id="alert" class="alert alert-error"></div>

      <div id="detailBody" hidden>
        <h1 id="d_date"></h1>
        <p class="muted" id="d_owner"></p>

        <dl class="detail-grid">
          <dt data-i18n="public_flight.launch">Launch site</dt>
          <dd id="d_launch"></dd>

          <dt data-i18n="public_flight.landing">Landing site</dt>
          <dd id="d_landing"></dd>

          <dt data-i18n="public_flight.category">Category</dt>
          <dd id="d_category"></dd>

          <dt data-i18n="public_flight.duration">Duration</dt>
          <dd id="d_duration"></dd>

          <dt data-i18n="public_flight.distance">Distance</dt>
          <dd id="d_distance"></dd>

          <dt data-i18n="public_flight.max_alt">Max altitude</dt>
          <dd id="d_maxalt"></dd>

          <dt data-i18n="public_flight.alt_gain">Altitude gain</dt>
          <dd id="d_altgain"></dd>

          <dt data-i18n="public_flight.total_descent">Total descent</dt>
          <dd id="d_totaldescent"></dd>

          <dt data-i18n="public_flight.technique">Launch technique</dt>
          <dd id="d_technique"></dd>
        </dl>

        <h2 data-i18n="public_flight.notes">Notes</h2>
        <p id="d_notes" class="muted"></p>

        <p id="d_profile_link" hidden></p>
      </div>
    </div>

    <div class="card" id="trackCard" hidden>
      <h2 data-i18n="flight_detail.track_title">Track</h2>

      <dl class="detail-grid">
        <dt data-i18n="flight_detail.track_duration">Duration</dt>
        <dd id="t_duration"></dd>

        <dt data-i18n="flight_detail.track_distance">Distance</dt>
        <dd id="t_distance"></dd>

        <dt data-i18n="flight_detail.track_max_alt">Max altitude</dt>
        <dd id="t_maxalt"></dd>

        <dt data-i18n="flight_detail.track_alt_gain">Altitude gain</dt>
        <dd id="t_altgain"></dd>

        <dt data-i18n="flight_detail.track_thermals">Thermals</dt>
        <dd id="t_thermals"></dd>

        <dt data-i18n="flight_detail.track_best_climb">Best climb</dt>
        <dd id="t_bestclimb"></dd>

        <dt data-i18n="flight_detail.track_peak_climb">Peak climb</dt>
        <dd id="t_peakclimb"></dd>

        <dt data-i18n="flight_detail.track_glide_ratio">Glide ratio</dt>
        <dd id="t_glideratio"></dd>

        <dt data-i18n="flight_detail.track_alt_source">Altitude source</dt>
        <dd id="t_altsource"></dd>
      </dl>

      <div id="trackMap" class="track-map"></div>

      <p class="muted" data-i18n="flight_detail.track_chart_legend">
        Orange marks climbing (thermal), blue marks gliding.
      </p>
      <div class="barogram-container"><canvas id="barogram"></canvas></div>
    </div>
  </main>

  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script src="/static/vendor/chartjs/chart.umd.js"></script>
  <script type="module" src="/static/public-flight.js"></script>
</body>
</html>
