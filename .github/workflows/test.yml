name: Backend tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is what local dev runs; 3.14 is what the Dockerfile ships.
        # Both must stay green so the runtime upgrade is proven, not assumed.
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pip install poetry==2.4.1

      - name: Install dependencies
        run: poetry install --with dev

      - name: Tests
        run: poetry run pytest --tb=short -q

      # No continue-on-error. Lenticularis carries that flag because an invalid
      # requires-python value makes ruff fail to parse pyproject.toml — which is
      # exactly how that bug went unnoticed for months.
      - name: Lint
        run: poetry run ruff check src/ tests/

      - name: Format check
        run: poetry run ruff format --check src/ tests/
